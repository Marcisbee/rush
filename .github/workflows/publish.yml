name: Publish rush-webtest

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish and verify npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release source and version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.argv[1])) process.exit(1)' "$version"
          git merge-base --is-ancestor HEAD origin/main
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          printf '%s\n' \
            "rush-$RELEASE_TAG-darwin-amd64.tar.gz" \
            "rush-$RELEASE_TAG-darwin-arm64.tar.gz" \
            "rush-$RELEASE_TAG-linux-amd64.tar.gz" \
            "rush-$RELEASE_TAG-linux-arm64.tar.gz" \
            "rush-release.json" |
            while IFS= read -r expected_asset; do
              grep -Fqx "$expected_asset" <<< "$actual_assets"
            done
          release_record_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --pattern rush-release.json --dir "$release_record_dir"
          node -e '
            const record = require(process.argv[1]);
            if (record.version !== process.argv[2] || record.commit !== process.argv[3]) process.exit(1);
          ' "$release_record_dir/rush-release.json" "$version" "$(git rev-parse HEAD)"
      - name: Install release toolchain
        run: |
          npm install --global npm@11.16.0 --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 libxtst6 xvfb xauth
      - name: Build and check release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
          npm ci --ignore-scripts
          npm run check
          npm run check:release
          npm run build
          go test ./...
          go build -o bin/rush ./cmd/rush
          npm pack --dry-run
      - name: Publish to npm
        run: npm publish --access public
      - name: Install from the public registry and run Rush
        run: |
          version="$(node --print "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            npm view "rush-webtest@$version" version && break
            if test "$attempt" = 6; then exit 1; fi
            sleep 10
          done
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund "rush-webtest@$version"
          printf '%s\n' \
            'import { expect, test } from "rush-webtest";' \
            'test("loads from npm", () => expect(document.body).toBeInTheDocument());' \
            > "$consumer/registry-smoke.test.ts"
          cd "$consumer"
          "$GITHUB_WORKSPACE/bin/rush" test registry-smoke.test.ts
