name: Windows WebView2 adapter

on:
  pull_request:
    paths:
      - "cmd/rush-webview2-harness/**"
      - "harness/**"
      - "platform/webview2/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows-adapter.yml"
  push:
    branches: [main]
    paths:
      - "cmd/rush-webview2-harness/**"
      - "harness/**"
      - "platform/webview2/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows-adapter.yml"

permissions:
  contents: read

concurrency:
  group: rush-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows host packages
        run: go test ./platform/webview2 ./harness
      - name: Run real WebView2 conformance harness
        run: go run ./cmd/rush-webview2-harness -repeats 5 -trusted-input=false
