name: macOS WKWebView adapter

on:
  pull_request:
    paths:
      - "cmd/rush/**"
      - "internal/rush/**"
      - "internal/wkwebview/**"
      - "go.mod"
      - "go.sum"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Makefile"
      - ".github/workflows/macos-adapter.yml"
  push:
    branches: [main]
    paths:
      - "cmd/rush/**"
      - "internal/rush/**"
      - "internal/wkwebview/**"
      - "go.mod"
      - "go.sum"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Makefile"
      - ".github/workflows/macos-adapter.yml"

permissions:
  contents: read

jobs:
  conformance-and-performance:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build Rush
        run: make build
      - name: Run Objective-C adapter and Go host tests
        run: go test -v -timeout 60s ./...
      - name: Verify system-framework-only native linkage
        run: |
          links="$(otool -L bin/rush)"
          echo "$links"
          if echo "$links" | grep -E 'libwebview|libswift|RushWKWebViewAdapter'; then
            echo "unexpected external WebView or Swift runtime linkage" >&2
            exit 1
          fi
          echo "$links" | grep '/System/Library/Frameworks/WebKit.framework/'
      - name: Exercise hidden WKWebView through the normal CLI
        run: |
          ./bin/rush doctor
          ./bin/rush test examples/basic.test.ts examples/browser-api.test.ts examples/javascript.test.js
          ./bin/rush stop
      - name: Validate the warm adapter performance contract
        run: |
          ./bin/rush bench --repeat 10 --cold-repeat 3 --json
          ./bin/rush stop
