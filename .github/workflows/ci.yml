name: Rush CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rush-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: TypeScript and Go contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check browser API types
        run: npm run check
      - name: Build browser API
        run: npm run build
      - name: Test native host contracts for races
        run: go test -race ./...

  linux-webkitgtk:
    name: Linux WebKitGTK conformance and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebKitGTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 libxtst6 xvfb xauth
      - run: npm ci --ignore-scripts
      - name: Build Rush
        run: make build
      - name: Verify native runtime
        run: ./bin/rush doctor
      - name: Run Rush self-test and real-browser examples
        run: >-
          ./bin/rush test
          test/*.test.ts
          examples/basic.test.ts
          examples/browser-api.test.ts
          examples/javascript.test.js
          examples/react.test.tsx
          examples/session.test.ts
      - name: Measure product performance contract
        run: |
          mkdir -p .rush/ci
          ./bin/rush bench --repeat 5 --cold-repeat 3 --json > .rush/ci/benchmarks.json
      - name: Upload benchmark samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-webkitgtk-benchmarks
          path: .rush/ci/benchmarks.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop warm daemon
        if: always()
        run: ./bin/rush stop || true
