name: Rush CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rush-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: TypeScript and Go contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check browser API types
        run: npm run check
      - name: Test release automation
        run: npm run check:release
      - name: Build browser API
        run: npm run build
      - name: Test native host contracts for races
        run: go test -race ./...

  linux-webkitgtk:
    name: Linux WebKitGTK conformance and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install WebKitGTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 libxtst6 xvfb xauth
      - run: npm ci --ignore-scripts
      - name: Build Rush
        run: make build
      - name: Verify native runtime
        run: ./bin/rush doctor
      - name: Run Rush self-test and real-browser examples
        run: >-
          ./bin/rush test
          test/*.test.ts
          examples/basic.test.ts
          examples/browser-api.test.ts
          examples/javascript.test.js
          examples/react.test.tsx
          examples/session.test.ts
      - name: Measure product performance contract
        run: |
          mkdir -p .rush/ci
          ./bin/rush bench --repeat 5 --cold-repeat 3 --json > .rush/ci/benchmarks.json
      - name: Upload benchmark samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-webkitgtk-benchmarks
          path: .rush/ci/benchmarks.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop warm daemon
        if: always()
        run: ./bin/rush stop || true
