name: Rush CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rush-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Go and browser API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check browser API types
        run: npm run check
      - name: Test browser API
        run: npm test
      - name: Build browser API
        run: npm run build
      - name: Test native host contracts
        run: go test ./...
      - name: Test native host contracts for races
        run: go test -race ./...

  linux-webkitgtk:
    name: Linux WebKitGTK conformance and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebKitGTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 libxtst6 xvfb xauth
      - run: npm ci
      - name: Build Rush
        run: make build
      - name: Verify native runtime
        run: ./bin/rush doctor
      - name: Run trusted app automation
        env:
          RUSH_WEBVIEW_POOL_SIZE: 1
        run: ./bin/rush test examples/app-automation.test.ts
      - name: Stop serial native-input daemon
        run: ./bin/rush stop
      - name: Run real-browser examples
        run: >-
          ./bin/rush test
          examples/basic.test.ts
          examples/browser-api.test.ts
          examples/javascript.test.js
          examples/react.test.tsx
          examples/session.test.ts
      - name: Measure product performance contract
        run: |
          mkdir -p .rush/ci
          ./bin/rush bench --repeat 5 --cold-repeat 3 --json > .rush/ci/benchmarks.json
      - name: Upload benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-webkitgtk-benchmarks
          path: .rush/ci/benchmarks.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop warm daemon
        if: always()
        run: ./bin/rush stop || true

  windows-webview2:
    name: Windows WebView2 adapter
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test Windows host packages
        run: go test ./platform/webview2 ./harness
      - name: Run real WebView2 conformance harness
        run: go run ./cmd/rush-webview2-harness -repeats 5
